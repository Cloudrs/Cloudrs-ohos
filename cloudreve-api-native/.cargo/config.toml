# CC env vars for ring and other C-building crates (cc-rs uses these for cross-compilation)
[env]
CC_aarch64_unknown_linux_ohos = 'D:\Huawei\DevEco Studio\sdk\default\openharmony\native\llvm\bin\clang.exe'
